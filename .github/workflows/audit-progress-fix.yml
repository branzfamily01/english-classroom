name: Apply progress resume audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-progress-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Engine, Teacher and My Hub module
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('_engine/v1/engine.js', '''window.LessonEngine = Object.freeze({
            getState,
            getCurrent: ()=>current(),
            jumpTo(index){
              if(!Number.isInteger(index) || index < 0 || index >= data.length) return false;
              slideIndex=index; step=0; render(); return true;
            }
          });''', '''window.LessonEngine = Object.freeze({
            getState,
            getCurrent: ()=>current(),
            getQuestionAt(index){
              if(!Number.isInteger(index) || index < 0 || index >= data.length) return null;
              const q=data[index];
              return Object.freeze({id:q?.id || '', key:q?.key || '', focus:q?.focus || ''});
            },
            jumpTo(index){
              // data.length is the END screen and is a valid resume target.
              if(!Number.isInteger(index) || index < 0 || index > data.length) return false;
              slideIndex=index; step=0; render(); return true;
            }
          });''')

          replace_once('_teacher/v1/teacher.js', '''  const key=progressKey(s.lessonId,p.schoolYear,p.className);
            const resumeSlideIndex = s.stage === 'output' ? s.slideIndex + 1 : s.slideIndex;
            store.progress[key]={
              schoolYear:p.schoolYear,
              className:p.className,
              lessonId:s.lessonId,
              questionId:s.questionId,
              questionKey:s.questionKey,
              slideIndex:s.slideIndex,
              step:s.step,
              stage:s.stage,
              resumeSlideIndex,
              savedAt:nowIso()
            };''', '''  if(s.slideIndex < 0){ toast('問題を開始してから進度を保存してください'); return false; }
            const key=progressKey(s.lessonId,p.schoolYear,p.className);
            const total=Number(window.LESSON_META?.questionCount || 0);
            let resumeSlideIndex = s.stage === 'output' ? s.slideIndex + 1 : s.slideIndex;
            const completed = total > 0 && resumeSlideIndex >= total;
            if(completed) resumeSlideIndex=total;
            const resumeQuestion=window.LessonEngine?.getQuestionAt?.(resumeSlideIndex) || null;
            const lastQuestion=completed ? window.LessonEngine?.getQuestionAt?.(total-1) : null;
            store.progress[key]={
              schoolYear:p.schoolYear,
              className:p.className,
              lessonId:s.lessonId,
              questionId:s.questionId || lastQuestion?.id || '',
              questionKey:s.questionKey || lastQuestion?.key || '',
              slideIndex:s.slideIndex,
              step:s.step,
              stage:s.stage,
              resumeSlideIndex,
              resumeQuestionId:resumeQuestion?.id || '',
              resumeQuestionKey:completed ? 'END' : (resumeQuestion?.key || s.questionKey || ''),
              completed,
              savedAt:nowIso()
            };''')

          replace_once('_teacher/v1/teacher.js', '''  const ok=window.LessonEngine?.jumpTo?.(saved.resumeSlideIndex);
            if(ok) setTimeout(()=>toast(`前回の続き：${saved.questionKey || '保存位置'}から`),50);''', '''  const ok=window.LessonEngine?.jumpTo?.(saved.resumeSlideIndex);
            if(ok){
              const message=saved.completed
                ? 'このLessonは前回までに完了しています'
                : `続き：${saved.resumeQuestionKey || saved.questionKey || '保存位置'}から`;
              setTimeout(()=>toast(message),50);
            }''')

          replace_once('my-hub-module/teaching-panel.js', '''    const saved=store.progress[progressKey(p.year,p.currentClass,l.id)];
              const pos=saved?.questionKey ? `前回：${saved.questionKey}` : '進度記録なし';
              const url=p.currentClass ? teacherUrl(l,p) : '#';
              const legacyNote=l.engine==='legacy' ? '<br>Legacy教材：自動進度保存は未対応' : '';
              return `<article class="teachhub-lesson">
                <h3>${esc(l.title)}</h3>
                <div class="teachhub-meta">${esc(l.series)} · ${esc(l.engine)}<br>${esc(pos)}${legacyNote}</div>
                <a class="teachhub-go" href="${esc(url)}" target="_blank" rel="noopener" ${p.currentClass?'':'aria-disabled="true"'}>▶ ${saved?'続きから授業':'授業開始'}</a>
              </article>`;''', '''    const saved=store.progress[progressKey(p.year,p.currentClass,l.id)];
              let pos='進度記録なし';
              if(saved?.questionKey){
                if(saved.completed) pos=`前回：${saved.questionKey}まで完了`;
                else if(saved.resumeQuestionKey && saved.resumeQuestionKey!==saved.questionKey) pos=`前回：${saved.questionKey}まで / 次回：${saved.resumeQuestionKey}`;
                else pos=`次回：${saved.resumeQuestionKey || saved.questionKey}から`;
              }
              const url=p.currentClass ? teacherUrl(l,p) : '#';
              const legacyNote=l.engine==='legacy' ? '<br>Legacy教材：自動進度保存は未対応' : '';
              const goLabel=saved?.completed?'完了画面を開く':(saved?'続きから授業':'授業開始');
              return `<article class="teachhub-lesson">
                <h3>${esc(l.title)}</h3>
                <div class="teachhub-meta">${esc(l.series)} · ${esc(l.engine)}<br>${esc(pos)}${legacyNote}</div>
                <a class="teachhub-go" href="${esc(url)}" target="_blank" rel="noopener" ${p.currentClass?'':'aria-disabled="true"'}>▶ ${goLabel}</a>
              </article>`;''')
          PY

          rm .github/workflows/audit-progress-fix.yml

          node --check _engine/v1/engine.js
          node --check _teacher/v1/teacher.js
          node --check my-hub-module/teaching-panel.js
          python tools/validate.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix progress resume and completion state"
          git push
