name: Apply Evergreen Lesson9
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Evergreen Lesson9
        shell: bash
        run: |
          cat \
            _tmp/evergreen-l9/part00.b64 \
            _tmp/evergreen-l9/part01.b64 \
            _tmp/evergreen-l9/part02.b64 \
            _tmp/evergreen-l9/part03.b64 \
            _tmp/evergreen-l9/part04.b64 \
            _tmp/evergreen-l9/part05.b64 \
            _tmp/evergreen-l9/part060.b64 \
            _tmp/evergreen-l9/part061.b64 \
            _tmp/evergreen-l9/part062.b64 \
            > /tmp/l9.b64
          base64 -d /tmp/l9.b64 > /tmp/l9.tar.gz
          tar -xzf /tmp/l9.tar.gz -C .
          rm -rf _tmp/evergreen-l9
          rm -f .github/workflows/apply-evergreen-l9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Evergreen Lesson9 with maps and diagrams'
          git push
