name: Apply Evergreen Lesson9
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Evergreen Lesson9 and validation updates
        shell: bash
        run: |
          cat > /tmp/l9.b64 <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 -d /tmp/l9.b64 > /tmp/l9.tar.gz
          tar -xzf /tmp/l9.tar.gz -C .
          node --check materials/evergreen/lesson9/lesson-data.js
          node --check materials/evergreen/lesson9/lesson-references.js
          node --check materials/evergreen/lesson9/lesson9-enhance.js
          python tools/validate.py
          rm -f .github/workflows/apply-evergreen-l9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Evergreen Lesson9 with maps and diagrams'
          git push
