name: Validate English Classroom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and invariants
        run: |
          node --check _engine/v1/audio.js
          node --check _engine/v1/engine.js
          node --check _teacher/v1/teacher.js
          node --check my-hub-module/teaching-panel.js
          node --check materials/evergreen/lesson8/lesson-data.js
          node --check materials/evergreen/lesson8/lesson-references.js
          node --check materials/evergreen/lesson8/lesson8-learning.js
          node --check materials/evergreen/lesson8/lesson8-enhance.js
          node --check materials/evergreen/lesson9/lesson-data.js
          node --check materials/evergreen/lesson9/lesson-references.js
          node --check materials/evergreen/lesson9/lesson9-learning.js
          node --check materials/evergreen/lesson9/lesson9-enhance.js
          node --check materials/evergreen/lesson10/lesson-data.js
          node --check materials/evergreen/lesson10/lesson-references.js
          node --check materials/evergreen/lesson10/lesson10-details-a.js
          node --check materials/evergreen/lesson10/lesson10-details-b.js
          node --check materials/evergreen/lesson10/lesson10-details-c.js
          node --check materials/evergreen/lesson10/lesson10-learning.js
          node --check materials/evergreen/lesson10/lesson10-enhance.js
          python tools/validate.py
      - name: Verify Evergreen Lesson8 learning layer
        run: |
          node - <<'NODE'
          global.window = global;
          require('./materials/evergreen/lesson8/lesson-data.js');
          require('./materials/evergreen/lesson8/lesson8-learning.js');
          const data=global.LESSON_DATA || [];
          if(data.length!==24) throw new Error(`expected 24 questions, got ${data.length}`);
          for(const q of data){
            if(!Array.isArray(q.hints) || q.hints.length<2) throw new Error(`${q.key}: needs at least two hints`);
            if(!Array.isArray(q.outputChunks) || q.outputChunks.length<2) throw new Error(`${q.key}: needs manual output chunks`);
            for(const h of q.hints){if(!h.en || !h.jp) throw new Error(`${q.key}: hint must have English + Japanese`);}
          }
          const final=global.LESSON_FINAL_CHECK?.sections || [];
          if(final.length<5) throw new Error('Final Check must contain quick response, distinction, backup, try, finish');
          if(!final.some(x=>x.type==='backup')) throw new Error('Final Check missing backup challenge');
          console.log('Evergreen L8 learning layer OK');
          NODE
      - name: Verify Evergreen Lesson9 learning layer
        run: |
          node - <<'NODE'
          global.window = global;
          require('./materials/evergreen/lesson9/lesson-data.js');
          require('./materials/evergreen/lesson9/lesson9-learning.js');
          const data=global.LESSON_DATA || [];
          if(data.length!==23) throw new Error(`expected 23 questions, got ${data.length}`);
          for(const q of data){
            if(!Array.isArray(q.hints) || q.hints.length<2) throw new Error(`${q.key}: needs at least two hints`);
            if(!Array.isArray(q.outputChunks) || q.outputChunks.length<2) throw new Error(`${q.key}: needs manual output chunks`);
            for(const h of q.hints){if(!h.en || !h.jp) throw new Error(`${q.key}: hint must have English + Japanese`);}
          }
          const final=global.LESSON_FINAL_CHECK?.sections || [];
          if(final.length<5) throw new Error('Final Check must contain quick response, distinction, backup, try, finish');
          if(!final.some(x=>x.type==='backup')) throw new Error('Final Check missing backup challenge');
          console.log('Evergreen L9 learning layer OK');
          NODE
      - name: Verify Evergreen Lesson10 learning layer
        run: |
          node - <<'NODE'
          global.window = global;
          require('./materials/evergreen/lesson10/lesson-data.js');
          require('./materials/evergreen/lesson10/lesson10-details-a.js');
          require('./materials/evergreen/lesson10/lesson10-details-b.js');
          require('./materials/evergreen/lesson10/lesson10-details-c.js');
          require('./materials/evergreen/lesson10/lesson10-learning.js');
          const data=global.LESSON_DATA || [];
          if(data.length!==22) throw new Error(`expected 22 questions, got ${data.length}`);
          for(const q of data){
            if(!Array.isArray(q.hints) || q.hints.length<2) throw new Error(`${q.key}: needs at least two hints`);
            if(!Array.isArray(q.outputChunks) || q.outputChunks.length<2) throw new Error(`${q.key}: needs manual output chunks`);
            if(!Array.isArray(q.mapPath) || !q.mapPath.length) throw new Error(`${q.key}: needs mapPath`);
            if(!q.visual?.kind) throw new Error(`${q.key}: needs question visual`);
            for(const h of q.hints){if(!h.en || !h.jp) throw new Error(`${q.key}: hint must have English + Japanese`);}
          }
          for(const key of ['1-(1)','1-(2)','1-(3)','1-(4)','1-(5)','1-(6)']){
            const q=data.find(x=>x.key===key);
            if(!q?.questionParts?.some(p=>p.underline)) throw new Error(`${key}: source underline missing`);
          }
          const final=global.LESSON_FINAL_CHECK?.sections || [];
          if(final.length<5) throw new Error('Final Check must contain quick response, distinction, backup, try, finish');
          if(!final.some(x=>x.type==='backup')) throw new Error('Final Check missing backup challenge');
          console.log('Evergreen L10 learning layer OK');
          NODE
      - name: Verify locked Clover source parity
        run: python tools/verify_clover_source_parity.py
      - name: Verify Evergreen Lesson8 authoritative source parity
        run: python tools/verify_evergreen8_source_parity.py
      - name: Verify Evergreen Lesson9 authoritative source parity
        run: python tools/verify_evergreen9_source_parity.py
      - name: Verify Evergreen Lesson10 authoritative source parity
        run: python tools/verify_evergreen10_source_parity.py
      - name: Test allowlist lesson exports
        run: |
          rm -rf /tmp/student-export
          mkdir -p /tmp/student-export
          python tools/student-export/export_lesson.py --lesson materials/clover/lesson9 --out /tmp/student-export
          touch /tmp/student-export/materials/clover/lesson9/stale-private.txt
          python tools/student-export/export_lesson.py --lesson materials/clover/lesson9 --out /tmp/student-export
          test ! -e /tmp/student-export/materials/clover/lesson9/stale-private.txt
          python tools/student-export/export_lesson.py --lesson materials/evergreen/lesson8 --out /tmp/student-export
          python tools/student-export/export_lesson.py --lesson materials/evergreen/lesson9 --out /tmp/student-export
          python tools/student-export/export_lesson.py --lesson materials/evergreen/lesson10 --out /tmp/student-export
          test -f /tmp/student-export/materials/clover/lesson9/index.html
          test -f /tmp/student-export/materials/evergreen/lesson8/index.html
          test -f /tmp/student-export/materials/evergreen/lesson8/lesson-references.js
          test -f /tmp/student-export/materials/evergreen/lesson8/lesson8-learning.js
          test -f /tmp/student-export/materials/evergreen/lesson8/lesson8-enhance.js
          test -f /tmp/student-export/materials/evergreen/lesson8/lesson8.css
          test -f /tmp/student-export/materials/evergreen/lesson9/index.html
          test -f /tmp/student-export/materials/evergreen/lesson9/lesson-references.js
          test -f /tmp/student-export/materials/evergreen/lesson9/lesson9-learning.js
          test -f /tmp/student-export/materials/evergreen/lesson9/lesson9-enhance.js
          test -f /tmp/student-export/materials/evergreen/lesson9/lesson9.css
          test -f /tmp/student-export/materials/evergreen/lesson10/index.html
          test -f /tmp/student-export/materials/evergreen/lesson10/lesson-references.js
          test -f /tmp/student-export/materials/evergreen/lesson10/lesson10-details-a.js
          test -f /tmp/student-export/materials/evergreen/lesson10/lesson10-details-b.js
          test -f /tmp/student-export/materials/evergreen/lesson10/lesson10-details-c.js
          test -f /tmp/student-export/materials/evergreen/lesson10/lesson10-learning.js
          test -f /tmp/student-export/materials/evergreen/lesson10/lesson10-enhance.js
          test -f /tmp/student-export/materials/evergreen/lesson10/lesson10.css
          test ! -e /tmp/student-export/materials/evergreen/lesson8/source-lock.json
          test ! -e /tmp/student-export/materials/evergreen/lesson9/source-lock.json
          test ! -e /tmp/student-export/materials/evergreen/lesson10/source-lock.json
          test ! -e /tmp/student-export/_teacher
          ! grep -R "_teacher/" /tmp/student-export
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('export_lesson','tools/student-export/export_lesson.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          for bad in ({'series':'../secret','lesson':'9'},{'series':'clover','lesson':'../9'},{'series':'clover/evil','lesson':'9'}):
              try: mod.safe_target(Path('/tmp/student-export'),bad)
              except RuntimeError: pass
              else: raise SystemExit(f'unsafe target accepted: {bad}')
          allowed=set(mod.SAFE_META_KEYS)|{'teacherMode'}
          for path in (
              Path('/tmp/student-export/materials/clover/lesson9/lesson-meta.json'),
              Path('/tmp/student-export/materials/evergreen/lesson8/lesson-meta.json'),
              Path('/tmp/student-export/materials/evergreen/lesson9/lesson-meta.json'),
              Path('/tmp/student-export/materials/evergreen/lesson10/lesson-meta.json')):
              meta=json.loads(path.read_text(encoding='utf-8'))
              assert meta.get('teacherMode') is False, path
              assert set(meta)<=allowed, (path,set(meta)-allowed)
          PY
      - name: Test yearly release gate and Netlify-ready build
        run: |
          rm -rf /tmp/year-gate /tmp/year-site
          if python tools/student-export/build_year_site.py \
            --year 2026 \
            --title "Gate Test" \
            --out /tmp/year-gate \
            --lesson materials/evergreen/lesson10; then
            echo "ERROR: review lesson escaped production release gate"
            exit 1
          fi
          test ! -e /tmp/year-gate/.student-site-build
          python tools/student-export/build_year_site.py \
            --year 2026 \
            --title "English Test - 2026" \
            --out /tmp/year-site \
            --allow-review \
            --lesson materials/clover/lesson9 \
            --lesson materials/evergreen/lesson8 \
            --lesson materials/evergreen/lesson9 \
            --lesson materials/evergreen/lesson10
          test -f /tmp/year-site/index.html
          test -f /tmp/year-site/robots.txt
          test -f /tmp/year-site/release-manifest.json
          test -f /tmp/year-site/materials/evergreen/lesson8/lesson8-learning.js
          test -f /tmp/year-site/materials/evergreen/lesson8/lesson8.css
          test -f /tmp/year-site/materials/evergreen/lesson9/lesson9-learning.js
          test -f /tmp/year-site/materials/evergreen/lesson9/lesson9.css
          test -f /tmp/year-site/materials/evergreen/lesson10/lesson10-learning.js
          test -f /tmp/year-site/materials/evergreen/lesson10/lesson10.css
          test ! -e /tmp/year-site/_teacher
